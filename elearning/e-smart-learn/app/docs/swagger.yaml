info:
  contact: {}
paths:
  /api/v1/admin/blogs:
    get:
      consumes:
      - application/json
      description: Retrieve paginated list of blogs with optional filters (admin only)
      parameters:
      - default: 10
        description: limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      - default: created_at
        description: sortBy
        enum:
        - created_at
        - title
        - view_total
        in: query
        name: sortBy
        type: string
      - default: desc
        description: sortOrder
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      - description: category ID
        in: query
        name: category_id
        type: string
      - description: blog status filter
        enum:
        - draft
        - published
        - scheduled
        in: query
        name: status
        type: string
      - description: search keyword (title)
        in: query
        name: keyword
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get list of blogs with filters (admin)
      tags:
      - blogs
  /api/v1/admin/blogs/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a single blog post by its ID (admin only)
      parameters:
      - description: Blog ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "404":
          description: Not Found
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get a blog post by ID (admin)
      tags:
      - blogs
  /api/v1/admin/blogs/statistics:
    get:
      consumes:
      - application/json
      description: Get blog KPI statistics for current user (total articles, total
        views, average engagement, counts by status)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
        "500":
          description: Internal Server Error
          schema: {}
      security:
      - BearerAuth: []
      summary: Get blog dashboard statistics (admin)
      tags:
      - blogs
  /api/v1/admin/coupons:
    get:
