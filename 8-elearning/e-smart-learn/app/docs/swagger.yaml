      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Username filter
        in: query
        name: username
        type: string
      - description: Name filter
        in: query
        name: name
        type: string
      - description: Sort e.g. username:desc,created_at:asc
        in: query
