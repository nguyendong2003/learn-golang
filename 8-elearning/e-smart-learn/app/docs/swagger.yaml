definitions:
  apperror.AppError:
    properties:
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
      type:
        $ref: '#/definitions/apperror.ErrorType'
    type: object
  apperror.ErrorType:
    enum:
    - not_found
    - bad_request
    - internal_server
    - unauthorized
    - forbidden
    - duplicate_entry
    - validation_error
    type: string
    x-enum-varnames:
    - NotFound
    - BadRequest
    - InternalServer
    - Unauthorized
    - Forbidden
    - DuplicateEntry
    - ValidationError
  dto.ApiResponse:
    properties:
      data: {}
      errors:
        items:
          $ref: '#/definitions/apperror.AppError'
        type: array
      metadata: {}
      path:
        type: string
      process_id:
        type: string
      request: {}
      status:
        $ref: '#/definitions/dto.ResponseStatus'
    type: object
  dto.BlogResponse:
    properties:
      author:
        $ref: '#/definitions/dto.InstructorResponse'
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      image_url:
        type: string
      title:
        type: string
      updated_at:
        type: string
      view_count:
        type: integer
    type: object
  dto.CategoryResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.CreateBlogRequest:
    properties:
      content:
        type: string
      image_url:
        type: string
      title:
        type: string
    required:
    - content
    - image_url
    - title
    type: object
  dto.CreateCategoryRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.CreateUserRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      roleID:
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - roleID
    - username
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.InstructorResponse:
    properties:
      balance:
        type: number
      bio:
        type: string
      education:
        type: string
      instagram_url:
        type: string
      linkedin_url:
        type: string
      rating_avg:
        type: number
      total_course:
        type: integer
      total_student:
        type: integer
      user:
        $ref: '#/definitions/dto.UserResponse'
      youtube_url:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.Pagination:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      sortBy:
        type: string
      sortOrder:
        type: string
      total:
        type: integer
    type: object
  dto.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.ResetPasswordRequest:
    properties:
      confirm_password:
        type: string
      email:
        type: string
      new_password:
        minLength: 6
        type: string
      reset_code:
        type: string
    required:
    - confirm_password
    - email
    - new_password
    - reset_code
    type: object
  dto.ResponseStatus:
    properties:
      code:
        type: integer
      type:
        type: string
    type: object
  dto.RoleResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.UpdateCategoryRequest:
    properties:
      description:
        type: string
      name:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - name
    type: object
  dto.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 6
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    type: object
  dto.UserResponse:
    properties:
      avatar:
        type: string
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/dto.RoleResponse'
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/auth/change-password:
    put:
      consumes:
      - application/json
      description: Change current user's password
      parameters:
      - description: Change password payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
      summary: Change password
      tags:
      - auth
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send reset password instructions to user's email
      parameters:
      - description: Forgot password payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Forgot password
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email/username and password
      parameters:
      - description: Login payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "401":
          description: Unauthorized
          schema: {}
      summary: Login
      tags:
      - auth
  /api/v1/auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Refresh access token using refresh token
      parameters:
      - description: Refresh token payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Refresh token
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: Register payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Register
      tags:
      - auth
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user's password using reset token
      parameters:
      - description: Reset password payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Reset password
      tags:
      - auth
  /api/v1/blogs:
    get:
      consumes:
      - application/json
      description: Retrieve paginated list of blogs with optional filters
      parameters:
      - default: 10
        description: limit
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      - default: created_at
        description: sortBy
        in: query
        name: sortBy
        type: string
      - default: asc
        description: sortOrder
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      - description: categoryId
        in: query
        name: categoryId
        type: string
      - description: type
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Get list of blogs
      tags:
      - blogs
    post:
      consumes:
      - application/json
      description: Create a new blog post and return created resource
      parameters:
      - description: Create blog payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBlogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.BlogResponse'
      security:
      - BearerAuth: []
      summary: Create a blog post
      tags:
      - blogs
  /api/v1/blogs/{slug}:
    delete:
      consumes:
      - application/json
      description: Delete a blog post identified by slug (mocked)
      parameters:
      - description: Blog Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: Delete a blog post (mock)
      tags:
      - blogs
    get:
      consumes:
      - application/json
      description: Returns a blog post identified by its slug, including author info,
        view count and timestamps.
      parameters:
      - description: Blog Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Retrieve a blog post by slug
      tags:
      - blogs
    put:
      consumes:
      - application/json
      description: Update an existing blog post identified by slug (mocked)
      parameters:
      - description: Blog Slug
        in: path
        name: slug
        required: true
        type: string
      - description: Update blog payload
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: Update a blog post (mock)
      tags:
      - blogs
  /api/v1/categories:
    get:
      consumes:
      - application/json
      description: Retrieve a paginated list of categories with filtering, sorting,
        and pagination support
      parameters:
      - default: 10
        description: 'Number of items per page (default: 10, max: 100)'
        in: query
        name: limit
        type: integer
      - default: 0
        description: 'Number of items to skip (default: 0)'
        in: query
        name: offset
        type: integer
      - default: created_at
        description: 'Field to sort by (default: created_at)'
        in: query
        name: sortBy
        type: string
      - default: desc
        description: 'Sort order: asc or desc (default: desc)'
        enum:
        - asc
        - desc
        in: query
        name: sortOrder
        type: string
      - description: Filter categories by name (partial match)
        in: query
        name: name
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CategoryResponse'
                  type: array
                metadata:
                  $ref: '#/definitions/dto.Pagination'
              type: object
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      summary: Get paginated list of categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new category with the provided name and description. Category
        name must be unique.
      parameters:
      - description: Category create request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: Invalid request payload or validation failed
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create a new category
      tags:
      - categories
  /api/v1/categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category by ID. Cannot delete a category that has associated
        courses.
      parameters:
      - description: Category ID (UUID format)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - categories
    get:
      consumes:
      - application/json
      description: Retrieve a single category by its ID
      parameters:
      - description: Category ID (UUID format)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: Invalid UUID format
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      summary: Get category by ID
      tags:
      - categories
    put:
      consumes:
      - application/json
      description: Update a category by ID with the provided name and description.
        Category name must be unique.
      parameters:
      - description: Category ID (UUID format)
        in: path
        name: id
        required: true
        type: string
      - description: Category update request
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CategoryResponse'
              type: object
        "400":
          description: Invalid UUID format or validation failed
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "404":
          description: Category not found
          schema:
            $ref: '#/definitions/dto.ApiResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update an existing category
      tags:
      - categories
  /api/v1/categories/all:
    get:
      consumes:
      - application/json
      description: Retrieve all categories without pagination
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/dto.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CategoryResponse'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      summary: Get all categories
      tags:
      - categories
  /api/v1/courses:
    get:
      consumes:
      - application/json
      description: Return a paginated list of courses (mocked)
      parameters:
      - description: page
        in: query
        name: page
        type: integer
      - description: limit
        in: query
        name: limit
        type: integer
      - description: sortBy
        in: query
        name: sortBy
        type: string
      - description: sortOrder
        in: query
        name: sortOrder
        type: string
      - description: categoryId
        in: query
        name: categoryId
        type: string
      - description: type
        in: query
        name: type
        type: string
      - description: search
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: View course list
      tags:
      - courses
  /api/v1/courses/{slug}:
    get:
      consumes:
      - application/json
      description: Return detailed information of a course by slug (mocked)
      parameters:
      - description: course slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: View course detail
      tags:
      - courses
  /api/v1/feedbacks:
    get:
      consumes:
      - application/json
      description: Retrieve list of feedbacks (mocked)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: Get list of feedbacks
      tags:
      - feedbacks
  /api/v1/health-check:
    get:
      consumes:
      - application/json
      description: Check service health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ApiResponse'
      summary: Ping
      tags:
      - main
  /api/v1/subscriptions:
    get:
      consumes:
      - application/json
      description: Return list of subscription plans (mocked)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: List subscription plans
      tags:
      - subscriptions
  /api/v1/users:
    get:
      consumes:
      - application/json
      description: Get list of users with pagination
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: List users
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create a new user
      parameters:
      - description: Create user payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Create user
      tags:
      - users
  /api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
      summary: Delete user
      tags:
      - users
    get:
      consumes:
      - application/json
      description: Get user details by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Update an existing user by ID
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
        "404":
          description: Not Found
          schema: {}
      summary: Update user
      tags:
      - users
  /api/v1/users/filter:
    get:
      consumes:
      - application/json
      description: Filter users by username/name and paginate/sort
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Page size
        in: query
        name: limit
        type: integer
      - description: Username filter
        in: query
        name: username
        type: string
      - description: Name filter
        in: query
        name: name
        type: string
      - description: Sort e.g. username:desc,created_at:asc
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema: {}
      summary: Filter and paginate users
      tags:
      - users
  /api/v1/users/me/courses:
    get:
      consumes:
      - application/json
      description: Return list of enrolled courses with progress (mocked)
      parameters:
      - description: limit
        in: query
        name: limit
        type: integer
      - description: offset
        in: query
        name: offset
        type: integer
      - description: sortBy
        in: query
        name: sortBy
        type: string
      - description: sortOrder
        in: query
        name: sortOrder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: Track user course progress
      tags:
      - user-courses
  /api/v1/users/me/courses/progress:
    post:
      consumes:
      - application/json
      description: Update progress for a lesson the user completed (mocked)
      parameters:
      - description: course progress payload
        in: body
        name: payload
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
      summary: Update course progress
      tags:
      - user-courses
securityDefinitions:
  ApiKeyAuth:
    in: header
