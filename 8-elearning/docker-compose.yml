version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: elearning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: elearning
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script/elearning.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - elearning-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Application
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: elearning-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION: "host=postgres user=postgres password=123456 dbname=elearning port=5432 sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elearning-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  elearning-network:
    driver: bridge
